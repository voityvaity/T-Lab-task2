name: Manual Task 2 smoke (CPU synthetic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only wheel avoids multi-GB CUDA dependencies on GitHub runners.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[train,dev]"
      - name: Dependency consistency and Python syntax
        run: |
          python -m pip check
          python -m compileall -q src tests scripts
      - name: Regression tests
        run: pytest -q
      - name: Generate synthetic fixture
        run: python scripts/make_synthetic.py --users 8 --events 90
      - name: Synthetic end-to-end training
        run: |
          python -m tlab2.experiment \
            --data data/synthetic_listens.csv --source-kind synthetic --output outputs/smoke \
            --users 8 --vocab 64 --context 12 --train-events 300 \
            --hidden 32 --layers 1 --heads 4 --batch 4 \
            --base-steps 6 --reward-steps 5 --rl-steps 3 \
            --rewards completion,balanced,conservative --betas 0.02 --rl-horizons 1,5 --rerank-alphas 0,1 \
            --eval-per-user 6 --cpu
      - name: Validate actual smoke outputs and genuine five-step windows
        run: python scripts/check_smoke.py --input outputs/smoke/experiment.json
      - name: Record exact environment and Git source
        if: success()
        run: |
          python -m pip freeze > outputs/smoke/requirements-frozen.txt
          git rev-parse HEAD > outputs/smoke/source-git-sha.txt
      - name: Build measured offline Markdown report
        if: success()
        run: python scripts/build_report.py --input outputs/smoke/experiment.json --output outputs/smoke/REPORT.md
      - name: Upload smoke results (NOT REAL Yambda measurements)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-synthetic-smoke
          path: outputs/smoke
          retention-days: 7
