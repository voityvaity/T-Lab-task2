name: Manual Yambda-50M RL research (CPU-intensive)

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Number of training-eligible users (pilot 64, larger >= 128)"
        type: choice
        options: ["64", "128", "256", "512"]
        default: "256"
      vocab:
        description: "Train-only catalog size including PAD/OOV"
        type: choice
        options: ["1024", "2048", "4096", "8192"]
        default: "4096"
      training:
        description: "Compute budget"
        type: choice
        options: ["pilot", "improved", "research"]
        default: "improved"
      seed:
        description: "Pre-registered replication seed"
        type: choice
        options: ["42", "43", "44"]
        default: "42"
      train_fraction:
        description: "Absolute timeline fraction used for train (valid=0.15)"
        type: choice
        options: ["0.65", "0.70", "0.75"]
        default: "0.70"
      supervised_objective:
        description: "Timestamp-safe dense autoregression or standard next-item ablation"
        type: choice
        options: ["time-safe-dense", "next-item-only"]
        default: "time-safe-dense"

permissions:
  contents: read

jobs:
  yambda:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and test
        run: |
          python -m pip install --upgrade pip
          # CPU-only wheel avoids multi-GB CUDA dependencies on GitHub runners.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[train,download,dev]"
          python -m pip check
          python -m compileall -q src tests scripts
          pytest -q
      - name: Download real, version-pinned Yambda-50M
        run: |
          hf download yandex/yambda flat/50m/listens.parquet \
            --repo-type dataset \
            --revision e8b04458db77e2fb30a24e65f78923fa48b7d297 \
            --local-dir data
      - name: Set controlled computational budget
        shell: bash
        run: |
          if [ "${{ inputs.training }}" = "research" ]; then
            echo "BASE_STEPS=1800" >> "$GITHUB_ENV"
            echo "REWARD_STEPS=800" >> "$GITHUB_ENV"
            echo "RL_STEPS=150" >> "$GITHUB_ENV"
            echo "TRAIN_EVENTS=100000" >> "$GITHUB_ENV"
            echo "EVAL_PER_USER=24" >> "$GITHUB_ENV"
            echo "CONTEXT=48" >> "$GITHUB_ENV"
            echo "BATCH=48" >> "$GITHUB_ENV"
            echo "RL_HORIZONS=1,5" >> "$GITHUB_ENV"
            echo "RL_REWARDS=completion,watch_time,balanced,conservative" >> "$GITHUB_ENV"
            echo "RL_BETAS=0.02,0.2" >> "$GITHUB_ENV"
          elif [ "${{ inputs.training }}" = "improved" ]; then
            # Enough supervised/reward updates for a meaningful first comparison.
            # Limit the RL grid; expand only after checking held-out reward quality.
            echo "BASE_STEPS=1500" >> "$GITHUB_ENV"
            echo "REWARD_STEPS=650" >> "$GITHUB_ENV"
            echo "RL_STEPS=120" >> "$GITHUB_ENV"
            echo "TRAIN_EVENTS=100000" >> "$GITHUB_ENV"
            echo "EVAL_PER_USER=24" >> "$GITHUB_ENV"
            echo "CONTEXT=48" >> "$GITHUB_ENV"
            echo "BATCH=48" >> "$GITHUB_ENV"
            echo "RL_HORIZONS=1,5" >> "$GITHUB_ENV"
            echo "RL_REWARDS=completion,conservative" >> "$GITHUB_ENV"
            echo "RL_BETAS=0.1" >> "$GITHUB_ENV"
          else
            # Fast and explicitly exploratory only.
            echo "BASE_STEPS=120" >> "$GITHUB_ENV"
            echo "REWARD_STEPS=80" >> "$GITHUB_ENV"
            echo "RL_STEPS=40" >> "$GITHUB_ENV"
            echo "TRAIN_EVENTS=30000" >> "$GITHUB_ENV"
            echo "EVAL_PER_USER=5" >> "$GITHUB_ENV"
            echo "CONTEXT=32" >> "$GITHUB_ENV"
            echo "BATCH=32" >> "$GITHUB_ENV"
            echo "RL_HORIZONS=1" >> "$GITHUB_ENV"
            echo "RL_REWARDS=completion,conservative" >> "$GITHUB_ENV"
            echo "RL_BETAS=0.1" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.supervised_objective }}" = "next-item-only" ]; then
            echo "DENSE_WEIGHT=0" >> "$GITHUB_ENV"
          else
            echo "DENSE_WEIGHT=0.65" >> "$GITHUB_ENV"
          fi
      - name: Fit supervised GPT-2, reward models, RL variants, evaluate
        run: |
          python -m tlab2.experiment \
            --data data/flat/50m/listens.parquet --source-kind yambda \
            --output outputs/yambda \
            --users "${{ inputs.users }}" --vocab "${{ inputs.vocab }}" \
            --seed "${{ inputs.seed }}" --train-fraction "${{ inputs.train_fraction }}" \
            --valid-fraction 0.15 \
            --base-steps "$BASE_STEPS" --reward-steps "$REWARD_STEPS" \
            --rl-steps "$RL_STEPS" --train-events "$TRAIN_EVENTS" \
            --batch "$BATCH" --context "$CONTEXT" --eval-per-user "$EVAL_PER_USER" \
            --dense-weight "$DENSE_WEIGHT" --reward-prior-smoothing 40 \
            --sft-patience 4 --reward-patience 5 \
            --rewards "$RL_REWARDS" \
            --betas "$RL_BETAS" --rl-horizons "$RL_HORIZONS" --rerank-alphas 0,1,3 \
            --cpu
      - name: Record exact Python package versions and Git commit
        if: success()
        run: |
          python -m pip freeze > outputs/yambda/requirements-frozen.txt
          git rev-parse HEAD > outputs/yambda/source-git-sha.txt
      - name: Build measured offline Markdown report
        if: success()
        run: python scripts/build_report.py --input outputs/yambda/experiment.json --output outputs/yambda/REPORT.md
      - name: Plot NDCG/reward tradeoffs from measured artifacts
        if: success()
        run: python scripts/plot_tradeoff.py --input outputs/yambda/experiment.json --outdir outputs/yambda
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-yambda-cpu-${{ inputs.training }}-${{ inputs.users }}-seed${{ inputs.seed }}-train${{ inputs.train_fraction }}-sft${{ inputs.supervised_objective }}
          path: outputs/yambda
          retention-days: 14
